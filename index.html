function folderAuthorButtons(p,mode){
  const name=String(p.authorName??'').trim();
  const handle=String(p.authorHandle??'').trim().replace(/^@/,'');
  const profile=authorProfileUrl(p.platform,handle);
  const attrs=profile?`href="${escapeHtml(profile)}" target="_blank" rel="noopener noreferrer"`:'href="#" aria-disabled="true" onclick="return false"';
  const nameButton=name?`<a class="btn author-name-action" ${attrs}>${escapeHtml(name)} ↗</a>`:'';
  const handleButton=handle?`<a class="btn author-handle-action" ${attrs}>@${escapeHtml(handle)} ↗</a>`:'';
  if(mode==='detail')return handleButton+nameButton;
  return nameButton||handleButton;
}

}장</div>${mode==='titleonly'?`<div class="title-priority"><span class="chip" title="중요도">${'⭐'.repeat(Math.min(5,Math.max(1,Number(p.priority)||1)))}</span></div>`:''}</div></div><div class="note-actions"><a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>${folderAuthorButtons(p,mode)}${mode==='detail'?`<button class="btn edit-action" data-editpost="${escapeHtml(p.id)}">수정</button><button class="btn danger delete-action" data-delpost="${escapeHtml(p.id)}">삭제</button>`:''}</div></article>`).join(''):'<div class="empty">검색 결과가 없거나 아직 등록된 스크랩이 없습니다.</div>'}

function modal(content){$('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true">${content}</div></div>`}
function folderModal(f){modal(`<h2>폴더 수정</h2><form id="folderEditForm"><div class="field"><label>폴더명</label><input name="name" required maxlength="70" value="${escapeHtml(f.name)}"></div><div class="field"><label>설명</label><textarea name="description">${escapeHtml(f.description)}</textarea></div>${folderStyleFields(f)}<div class="field"><label>상위 폴더</label><select name="parentId"><option value="">최상위 폴더</option>${folderOptionHtml(f.platform,folderParent(f),f.id)}</select></div><div class="actions"><button class="btn primary" type="submit">저장</button><button class="btn" type="button" data-close>취소</button></div></form>`);$('folderEditForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const style=readFolderStyle(e.target);if(!style)return;await put('folders',{...f,name:String(fd.get('name')).trim(),description:String(fd.get('description')).trim(),parentId:String(fd.get('parentId')||'')||null,...style});closeModal();await refresh()};initFolderStyleControls($('folderEditForm'))}
function keywordSuggestion(text){const words=String(text).replace(/https?:\/\/\S+/g,' ').match(/[가-힣A-Za-z0-9]{2,}/g)||[];const stop=new Set(['그리고','하지만','있는','대한','관련','정보','내용','정리','위한','this','that','with','from']);const count={};for(const w of words){const k=w.toLowerCase();if(!stop.has(k))count[k]=(count[k]||0)+1}return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}
function validUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function authorAccounts(){const map=new Map();for(const p of posts){const handle=String(p.authorHandle||'').trim().replace(/^@/,'');const name=String(p.authorName||'').trim();if(!handle&&!name)continue;const key=p.platform+'|'+handle.toLowerCase()+'|'+name.toLowerCase();const f=folders.find(x=>x.id===p.folderId);if(!map.has(key))map.set(key,{name,handle,platform:p.platform,folderName:f?.name||'삭제된 폴더'});}return [...map.values()].filter(a=>a.platform===route.platform).sort((a,b)=>a.name.localeCompare(b.name,'ko'));}
function authorProfileUrl(platform,handle){const h=String(handle||'').trim().replace(/^@/,'');if(!h)return '';if(platform==='instagram'&&/^[a-zA-Z0-9._]{1,30}$/.test(h))return 'https://www.instagram.com/'+encodeURIComponent(h)+'/';if(platform==='twitter'&&/^[a-zA-Z0-9_]{1,15}$/.test(h))return 'https://x.com/'+encodeURIComponent(h);return '';}
function addAuthorKeywords(words,name,handle){const list=[...words];for(const w of [name,handle.replace(/^@/,'')]){const k=String(w||'').trim();if(k&&!list.some(x=>x.toLowerCase()===k.toLowerCase()))list.push(k)}return list.slice(0,12)}

    const root = document.querySelector('#modalRoot');
    if (!root) return;

    const dialog = root.querySelector('.dialog');
    const form = root.querySelector('#folderForm');

    if (!dialog || !form) return;

    const details = form.closest('details');

    if (details) {
      details.open = true;
      details.style.display = 'block';
    }

    if (!dialog.querySelector('.subfolder-modal-close')) {
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'subfolder-modal-close';
      close.textContent = '×';
      close.setAttribute('aria-label', '팝업 닫기');
      dialog.prepend(close);
    }

    const emojiButton = root.querySelector('.subfolder-emoji-toggle');

    if (emojiButton) {
      emojiButton.textContent = '전체 이모지 선택';
    }
  }

  const observer = new MutationObserver(adjustSubfolderModal);

  function initialize() {
    const root = document.querySelector('#modalRoot');
    if (root) {
      observer.observe(root, { childList: true, subtree: true });
    }

    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'openSubfolderModal';
    button.className = 'btn primary';
    button.textContent = '+ 하위 폴더 생성';

    const placeButton = () => {
      const edit = [...document.querySelectorAll('button')]
        .find(el => el.textContent.trim() === '폴더 수정');

      if (!edit) return;

      const actions = edit.parentElement;
      if (!actions) return;

      if (!document.getElementById('openSubfolderModal')) {
        actions.prepend(button);
      }
    };

    placeButton();

    const pageObserver = new MutationObserver(placeButton);
    pageObserver.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }
})();
</script>


<!-- subfolder-modal-adjust-v4 -->
<script>
(function () {
  function adjustSubfolderUI() {
    // 1. 버튼 순서 변경
    const addButton = document.getElementById('openSubfolderModal');

    if (addButton) {
      const buttons = [...document.querySelectorAll('button')];

      const deleteButton = buttons.find(
        b => b.textContent.trim() === '폴더 삭제'
      );

      const scrapButton = buttons.find(
        b => b.textContent.trim() === '+ 스크랩 추가'
      );

      if (
        deleteButton &&
        scrapButton &&
        deleteButton.parentElement === scrapButton.parentElement &&
        addButton.nextElementSibling !== scrapButton
      ) {
        scrapButton.before(addButton);
      }
    }

    // 2. 팝업 내부 이모지 선택 버튼 문구 변경
    const modal = document.querySelector('#modalRoot');

    if (!modal || !modal.querySelector('#folderForm')) return;

    const emojiButtons = [
      ...modal.querySelectorAll('button')
    ];

    const emojiButton = emojiButtons.find(b =>
      b.textContent.includes('전체 이모지 검색') ||
      b.textContent.includes('전체 이모지 선택')
    );

    if (emojiButton) {
      const desired = '전체 이모지 선택';

      if (emojiButton.textContent.trim() !== desired) {
        emojiButton.textContent = desired;
      }

      emojiButton.setAttribute(
        'aria-label',
        '전체 이모지 선택'
      );
    }
  }

  let scheduled = false;

  function scheduleAdjustment() {
    if (scheduled) return;

    scheduled = true;

    requestAnimationFrame(() => {
      scheduled = false;
      adjustSubfolderUI();
    });
  }

  function initialize() {
    scheduleAdjustment();

    const observer = new MutationObserver(scheduleAdjustment);

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }
})();
</script>


<!-- subfolder-button-order-v5 -->
<script>
(function () {
  function arrangeButtons() {
    const addButton =
      document.getElementById('openSubfolderModal');

    if (!addButton) return;

    const buttons = [
      ...document.querySelectorAll('button')
    ];

    const findButton = (label) =>
      buttons.find(b => b.textContent.trim() === label);

    const editButton = findButton('폴더 수정');
    const deleteButton = findButton('폴더 삭제');
    const scrapButton = findButton('+ 스크랩 추가');

    if (!editButton || !deleteButton || !scrapButton) {
      return;
    }

    const target = scrapButton.parentElement;

    if (!target) return;

    // 기존 버튼 스타일을 유지하며 순서만 변경
    const desired = [
      editButton,
      deleteButton,
      addButton,
      scrapButton
    ];

    const alreadyOrdered =
      desired.every((button, index) =>
        button.parentElement === target &&
        (
          index === 0 ||
          desired[index - 1].nextElementSibling === button
        )
      );

    if (alreadyOrdered) return;

    for (const button of desired) {
      target.appendChild(button);
    }
  }

  let scheduled = false;

  function scheduleArrange() {
    if (scheduled) return;

    scheduled = true;

    requestAnimationFrame(() => {
      scheduled = false;
      arrangeButtons();
    });
  }

  function initialize() {
    scheduleArrange();

    const observer = new MutationObserver(scheduleArrange);

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }
})();
</script>

<script>
(function () {
  function arrangeFolderButtons() {
    const edit = document.getElementById('editFolder');
    const remove = document.getElementById('deleteFolder');
    const subfolder = document.getElementById('openSubfolderModal');
    const scrap = document.getElementById('addPost');

    if (!edit || !remove || !subfolder || !scrap) return;

    const container = scrap.parentElement;
    if (!container) return;

    const order = [edit, remove, subfolder, scrap];

    const correct = order.every((button, index) =>
      button.parentElement === container &&
      (index === 0 || order[index - 1].nextElementSibling === button)
    );

    if (correct) return;

    order.forEach(button => container.appendChild(button));
  }

  let scheduled = false;

  function scheduleUpdate() {
    if (scheduled) return;
    scheduled = true;

    requestAnimationFrame(() => {
      scheduled = false;

  }

  function initialize() {
    scheduleUpdate();

    const observer = new MutationObserver(scheduleUpdate);

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);

    initialize();
  }
})();
</script>

<script>
(function () {
  function matchButtonHeight() {
    const blue = document.getElementById('addPost');
    const whiteButtons = [
      document.getElementById('editFolder'),
      document.getElementById('deleteFolder')
    ];

    if (!blue || whiteButtons.some(button => !button)) return;

    const height = blue.getBoundingClientRect().height;
    if (!height) return;

    whiteButtons.forEach(button => {
      button.style.setProperty('height', height + 'px', 'important');
      button.style.setProperty('min-height', height + 'px', 'important');
      button.style.setProperty('max-height', height + 'px', 'important');
      button.style.setProperty('box-sizing', 'border-box', 'important');
    });
  }

  function update() {
    requestAnimationFrame(matchButtonHeight);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', update);
  } else {
    update();
  }

  window.addEventListener('resize', update);
})();
</script>


<!-- folder-button-diagnostic-v1 -->
<script>
(function () {
  const ids = [
    ["editFolder", "폴더 수정"],
    ["deleteFolder", "폴더 삭제"],
    ["openSubfolderModal", "하위 폴더 생성"],
    ["addPost", "스크랩 추가"]
  ];

  const panel = document.createElement("div");
  panel.id = "folderButtonDiagnostic";
  panel.style.cssText = [
    "position:fixed",
    "left:12px",
    "bottom:12px",
    "z-index:2147483647",
    "background:#ffffff",
    "color:#222222",
    "border:2px solid #465cc7",
    "border-radius:12px",
    "padding:14px",
    "font:13px/1.6 sans-serif",
    "box-shadow:0 4px 20px #0003",
    "max-width:calc(100vw - 24px)",
    "max-height:50vh",
    "overflow:auto"
  ].join(";");

  panel.innerHTML =
    '<div style="display:flex;justify-content:space-between;gap:20px">' +
    '<strong>버튼 크기 진단</strong>' +
    '<button type="button" id="folderDiagClose">닫기</button>' +
    '</div><div id="folderDiagResult"></div>' +
    '<button type="button" id="folderDiagRefresh">다시 측정</button>';

  document.body.appendChild(panel);

  function measure() {
    const lines = ids.map(([id, label]) => {
      const el = document.getElementById(id);

      if (!el) {
        return label + ": 현재 화면에 없음";
      }

      const rect = el.getBoundingClientRect();
      const css = getComputedStyle(el);

      return label +
        ": 실제 " + rect.height.toFixed(1) + "px" +
        " / CSS " + css.height +
        " / 글자 " + css.fontSize +
        " / 상하 여백 " + css.paddingTop +
        ", " + css.paddingBottom;
    });

    document.getElementById("folderDiagResult")
      .textContent = lines.join("\n");
    document.getElementById("folderDiagResult")
      .style.whiteSpace = "pre-wrap";
  }

  document.getElementById("folderDiagClose")
    .addEventListener("click", () => panel.remove());

  document.getElementById("folderDiagRefresh")
    .addEventListener("click", measure);

  document.addEventListener("click", () => {
    if (panel.isConnected) {
      requestAnimationFrame(measure);
    }
  });

  measure();
})();
</script>
