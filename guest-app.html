function archiveLocalDay(value){
  const d=new Date(value);
  if(!Number.isFinite(d.getTime()))return null;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function archiveDateLabel(d){return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`}
function updateArchivePeriod(){
  const target=$('archivePeriod');if(!target)return;
  const today=archiveLocalDay(new Date());
  const dates=posts.map(p=>archiveLocalDay(p.createdAt)).filter(Boolean);
  if(!dates.length){target.textContent=`스크랩 시작 전 · ${archiveDateLabel(today)}`;return;}
  const first=new Date(Math.min(...dates.map(d=>d.getTime())));
  const startUTC=Date.UTC(first.getFullYear(),first.getMonth(),first.getDate());
  const todayUTC=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
  const elapsed=Math.max(0,Math.round((todayUTC-startUTC)/86400000));
  target.textContent=`${archiveDateLabel(first)} ~ ${archiveDateLabel(today)} (D+${elapsed})`;
}

/* nested-folders-v1: 기존 폴더는 parentId가 없으면 최상위로 간주 */
function folderParent(f){return f?.parentId||null}
function folderChildren(id,platform){return folders.filter(f=>f.platform===platform&&folderParent(f)===(id||null)).sort((a,b)=>(Number.isFinite(a.sortOrder)?a.sortOrder:1e9)-(Number.isFinite(b.sortOrder)?b.sortOrder:1e9)||a.name.localeCompare(b.name,'ko'))}
function folderAncestors(id){const result=[],seen=new Set();let current=folders.find(f=>f.id===id);while(current&&!seen.has(current.id)){seen.add(current.id);result.unshift(current);current=folders.find(f=>f.id===folderParent(current))}return result}
function folderDescendants(id){const found=new Set(),pending=[id];while(pending.length){const cur=pending.pop();for(const f of folders){if(folderParent(f)===cur&&!found.has(f.id)&&f.id!==id){found.add(f.id);pending.push(f.id)}}}return found}
/* foldercount-20261123: 아래 모든 단계 폴더의 스크랩까지 합친 수 */
function folderPostTotal(id){const ids=folderDescendants(id);ids.add(id);return posts.filter(p=>ids.has(p.folderId)).length}

async function trashItems(folderIds,postIds,label){

function trashGroups(fa,pa){

  if(!m.has(k))m.set(k,{id:k,label:x.trashLabel||'삭제한 항목',at:x.trashedAt,folders:[],posts:[]});m.get(k)[kind].push(x)}

async function purgeTrash(id){

function folderAuthorButtons(p,mode){
  const name=String(p.authorName??'').trim();
  const handle=String(p.authorHandle??'').trim().replace(/^@/,'');
  const profile=authorProfileUrl(p.platform,handle);
  const attrs=profile?`href="${escapeHtml(profile)}" target="_blank" rel="noopener noreferrer"`:'href="#" aria-disabled="true" onclick="return false"';
  const nameButton=name?`<a class="btn author-name-action" ${attrs}>${escapeHtml(name)} ↗</a>`:'';
  const handleButton=handle?`<a class="btn author-handle-action" ${attrs}>@${escapeHtml(handle)} ↗</a>`:'';
  if(mode==='detail')return handleButton+nameButton;
  return nameButton||handleButton;
}

function updatePostList(){queueMicrotask(()=>window.scrapFontApply?.());if(!route.folder||!$('postList'))return;const q=$('search').value.trim().toLocaleLowerCase(),sort=$('sort').value,mode=$('display').value;let list=posts.filter(p=>p.folderId===route.folder&&[p.title,p.summary,(p.keywords||[]).join(' ')].join(' ').toLocaleLowerCase().includes(q));list.sort((a,b)=>sort==='manual'?manualPostCompare(a,b):sort==='name'?a.title.localeCompare(b.title,'ko'):sort==='priority'?(b.priority||0)-(a.priority||0)||b.createdAt.localeCompare(a.createdAt):sort==='old'?a.createdAt.localeCompare(b.createdAt):b.createdAt.localeCompare(a.createdAt));$('postCount').textContent=`${list.length}개`; $('postList').classList.toggle('folder-post-grid',folderLayout==='grid');const toggle=$('folderLayoutToggle');if(toggle){toggle.textContent=folderLayout==='list'?'▦ 그리드뷰로 전환':'☰ 리스트뷰로 전환';toggle.setAttribute('aria-label',folderLayout==='list'?'그리드뷰로 전환':'리스트뷰로 전환');toggle.setAttribute('aria-pressed',String(folderLayout==='grid'));} $('postList').innerHTML=list.length?list.map(p=>`<article class="note ${mode}" data-font-post="${escapeHtml(p.id)}"><div class="note-main">${mode!=='detail'&&(p.images||[]).length?`<div class="note-cover"><img tabindex="0" role="button" data-image="${escapeHtml(p.id)}" data-index="0" src="${p.images[0]}" alt="${escapeHtml(p.title)} 대표 이미지 확대">${p.images.length>1?`<span class="cover-count">+${p.images.length-1}</span>`:''}</div>`:''}<div class="note-text"><h3>${escapeHtml(p.title)}</h3><div class="chips">${(p.keywords||[]).map(k=>`<span class="chip">#${escapeHtml(k)}</span>`).join('')}<span class="chip" title="중요도">${'⭐'.repeat(Math.min(5,Math.max(1,Number(p.priority)||1)))}</span></div><p class="summary">${escapeHtml(p.summary)}</p><div class="thumbs">${(p.images||[]).map((img,i)=>`<img class="thumb" tabindex="0" role="button" data-image="${escapeHtml(p.id)}" data-index="${i}" src="${img}" alt="첨부 이미지 ${i+1}">`).join('')}</div><div class="meta"><span class="meta-date">추가일 ${formatDate(p.createdAt)}</span><span class="meta-sep"> · </span><span class="meta-img">이미지 ${(p.images||[]).length}장</span></div>${mode==='titleonly'?`<div class="title-priority"><span class="chip" title="중요도">${'⭐'.repeat(Math.min(5,Math.max(1,Number(p.priority)||1)))}</span></div>`:''}</div></div><div class="note-actions"><a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>${folderAuthorButtons(p,mode)}${mode==='detail'?`<button class="btn edit-action" data-editpost="${escapeHtml(p.id)}">수정</button><button class="btn danger delete-action" data-delpost="${escapeHtml(p.id)}">삭제</button>`:''}</div></article>`).join(''):'<div class="empty">검색 결과가 없거나 아직 등록된 스크랩이 없습니다.</div>'}

function keywordSuggestion(text){const words=String(text).replace(/https?:\/\/\S+/g,' ').match(/[가-힣A-Za-z0-9]{2,}/g)||[];const stop=new Set(['그리고','하지만','있는','대한','관련','정보','내용','정리','위한','this','that','with','from']);const count={};for(const w of words){const k=w.toLowerCase();if(!stop.has(k))count[k]=(count[k]||0)+1}return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}

function authorAccounts(){const map=new Map();for(const p of posts){const handle=String(p.authorHandle||'').trim().replace(/^@/,'');const name=String(p.authorName||'').trim();if(!handle&&!name)continue;const key=p.platform+'|'+handle.toLowerCase()+'|'+name.toLowerCase();const f=folders.find(x=>x.id===p.folderId);if(!map.has(key))map.set(key,{name,handle,platform:p.platform,folderName:f?.name||'삭제된 폴더'});}return [...map.values()].filter(a=>a.platform===route.platform).sort((a,b)=>a.name.localeCompare(b.name,'ko'));}

se=edit&&!fd.get('clearImages')?(p.images||[]):[];const record={id:p?.id||uid(),platform:route.platform,folderId:String(fd.get('targetFolderId')||route.folder),title,url,summary:String(fd.get('summary')).trim(),authorName:String(fd.get('authorName')).trim(),authorHandle:String(fd.get('authorHandle')).trim().replace(/^@/,''),keywords:addAuthorKeywords(String(fd.get('keywords')).split(',').map(s=>s.trim()).filter(Boolean),String(fd.get('authorName')).trim(),String(fd.get('authorHandle')).trim()),priority:Math.min(5,Math.max(1,Number(fd.get('priority'))||1)),images:[...base,...imgs],createdAt:p?.createdAt||today(),updatedAt:today()};try{await put('posts',record);closeModal();await refresh()}catch(err){alert('저장에 실패했습니다. 브라우저 저장 공간을 확인하세요. '+err.message)}}}

async function exportBackup(){
  const button=$('exportBtn');
  if(button.disabled)return;
  const label=button.textContent;
  button.disabled=true;button.textContent='백업 준비 중…';
  try{
    const [savedFolders,savedPosts]=await Promise.all([getAllRaw('folders'),getAllRaw('posts')]);
    const payload={version:1,exportedAt:today(),folders:savedFolders,posts:savedPosts};
    const filename='스크랩허브_백업_'+new Date().toISOString().slice(0,10)+'.json';
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // iOS Safari에서 다운로드가 시작되기 전에 Blob URL이 해제되지 않도록 충분히 유지합니다.
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    alert('백업 파일 저장을 요청했습니다. Safari의 다운로드 항목 또는 파일 앱의 다운로드 폴더를 확인해 주세요.\n폴더 '+savedFolders.length+'개 · 스크랩 '+savedPosts.length+'개');
  }catch(err){
    console.error('Backup export failed',err);
    alert('백업을 생성하지 못했습니다: '+(err?.message||String(err))+'\n인터넷 연결과 로그인 상태를 확인해 주세요.');
  }finally{button.disabled=false;button.textContent=label;}
}
async function importBackup(file){if(!file)return;try{if(file.size>80*1024*1024)throw Error('파일이 80MB를 초과합니다.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.folders)||!Array.isArray(data.posts))throw Error('지원하지 않는 백업 형식입니다.');if(!confirm(`폴더 ${data.folders.length}개와 스크랩 ${data.posts.length}개를 가져오시겠습니까? 같은 ID는 덮어씁니다.`))return;for(const f of data.folders){if(typeof f.id==='string'&&platforms[f.platform]&&typeof f.name==='string')await put('folders',f)}for(const p of data.posts){if(typeof p.id==='string'&&platforms[p.platform]&&validUrl(p.url)&&typeof p.folderId==='string'&&Array.isArray(p.images))await put('posts',p)}await refresh();alert('가져오기가 완료되었습니다.')}catch(err){alert('가져오기 실패: '+err.message)}finally{$('importFile').value=''}}

(()=>{if(window.SCRAP_GUEST_MODE)return;
 let pending=null,active=null,selected=null,blockClickUntil=0;
 const card=node=>node?.closest?.('.folders .folder[data-folder]');
 const clearPending=()=>{if(pending?.timer)clearTimeout(pending.timer);pending=null};
 function startDrag(el,x,y){
   if(selected)return;
   if(!el.isConnected)return;
   const box=el.getBoundingClientRect();
   const ghost=el.cloneNode(true);
   ghost.removeAttribute('data-folder');
   ghost.classList.add('folder-drag-ghost');
   Object.assign(ghost.style,{position:'fixed',left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px',margin:'0',zIndex:'99999',pointerEvents:'none',transform:'none',transition:'none',opacity:'.95',boxShadow:'0 12px 30px #1d33603b',background:'#fff'});
   document.body.appendChild(ghost);
   active={el,ghost,container:el.closest('.folders'),dx:x-box.left,dy:y-box.top,target:null};
   el.classList.add('folder-dragging');
   blockClickUntil=Date.now()+1800;
 }
 function moveDrag(x,y){
   if(!active)return;
   const d=active;
   d.ghost.style.left=(x-d.dx)+'px';
   d.ghost.style.top=(y-d.dy)+'px';
   d.target?.classList.remove('folder-drop-target');
   const hovered=card(document.elementFromPoint(x,y));
   d.target=hovered&&hovered!==d.el&&hovered.closest('.folders')===d.container?hovered:null;
   d.target?.classList.add('folder-drop-target');
 }
 async function finishDrag(cancel){
   clearPending();
   if(!active)return;
   const d=active;active=null;blockClickUntil=Date.now()+1800;
   d.ghost.remove();d.el.classList.remove('folder-dragging');
   d.target?.classList.remove('folder-drop-target');
   if(cancel)return;
   if(!d.target){selected=d.el;selected.classList.add('folder-reorder-selected');showTip();return;}
   const ids=[...d.container.querySelectorAll('.folder[data-folder]')].map(n=>n.dataset.folder);
   const from=ids.indexOf(d.el.dataset.folder),to=ids.indexOf(d.target.dataset.folder);
   if(from<0||to<0||from===to)return;
   ids.splice(to,0,ids.splice(from,1)[0]);
   try{
     for(let i=0;i<ids.length;i++){
       const record=folders.find(f=>f.id===ids[i]);
       if(record&&record.sortOrder!==i)await put('folders',{...record,sortOrder:i});
     }
     await refresh();
   }catch(err){alert('폴더 순서 저장 실패: '+(err?.message||err));await refresh()}
 }
 document.addEventListener('touchstart',e=>{
   if(active||selected||e.touches.length!==1)return;
   const el=card(e.target);if(!el)return;
   clearPending();
   const t=e.touches[0],x=t.clientX,y=t.clientY;
   const timer=setTimeout(()=>{if(pending?.timer===timer){pending=null;startDrag(el,x,y)}},420);
   pending={timer,x,y};
 },{capture:true,passive:true});
 document.addEventListener('touchmove',e=>{
   const t=e.touches[0];if(!t)return;
   if(active){if(e.cancelable)e.preventDefault();moveDrag(t.clientX,t.clientY)}
   else if(pending&&Math.hypot(t.clientX-pending.x,t.clientY-pending.y)>9)clearPending();
 },{capture:true,passive:false});
 document.addEventListener('touchend',e=>{
   if(active){
     const t=e.changedTouches[0];if(t)moveDrag(t.clientX,t.clientY);
     void finishDrag(false);
   }else clearPending();
 },{capture:true});
 document.addEventListener('touchcancel',()=>{if(active)void finishDrag(true);else clearPending()},{capture:true});
 document.addEventListener('pointerdown',e=>{
   if(e.pointerType==='touch'||e.button!==0||active||selected)return;
   const el=card(e.target);if(!el)return;
   clearPending();
   const x=e.clientX,y=e.clientY;
   const timer=setTimeout(()=>{if(pending?.timer===timer){pending=null;startDrag(el,x,y)}},420);
   pending={timer,x,y};
 },true);
 document.addEventListener('pointermove',e=>{
   if(e.pointerType==='touch')return;
   if(active){moveDrag(e.clientX,e.clientY);e.preventDefault()}
   else if(pending&&Math.hypot(e.clientX-pending.x,e.clientY-pending.y)>9)clearPending();
 },true);
 document.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'){if(active)void finishDrag(false);else clearPending()}},true);
 document.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch'){if(active)void finishDrag(true);else clearPending()}},true);
 function showTip(){
   let tip=document.getElementById('folderReorderTip');
   if(!tip){tip=document.createElement('div');tip.id='folderReorderTip';tip.className='folder-reorder-tip';document.body.appendChild(tip)}
   tip.innerHTML='순서를 바꿀 위치의 폴더를 터치하세요. <button type="button" id="folderMoveOpen">다른 폴더로 이동</button><button type="button" id="folderReorderCancel">취소</button>';

       const record=folders.find(f=>f.id===ids[i]);

   if(e.target.closest?.('#folderMoveOpen')){e.preventDefault();e.stopImmediatePropagation();const id=selected?.dataset.folder;stopSelection();blockClickUntil=0;if(id)window.openItemMoveDialog?.('folder',id);return}if(e.target.closest?.('#folderReorderCancel')){e.preventDefault();e.stopImmediatePropagation();stopSelection();return}

<!-- cleanup-20261123: 폴더 팝업 정리 (subfolder-modal v3~v6, folder-white-button-match, folder-button-diagnostic 대체) -->
<script>
(function () {
  // 폴더 생성 팝업(하위·상위 공통): 접힌 입력 영역 펼치기, 오른쪽 위 × 닫기 버튼, 이모지 버튼 문구
  function tidyFolderModal() {
    const root = document.getElementById('modalRoot');
    const dialog = root && root.querySelector('.dialog');
    const form = root && root.querySelector('#folderForm');
    if (!dialog || !form) return;
    const details = form.closest('details');
    if (details) { if (!details.open) details.open = true; if (details.style.display !== 'block') details.style.display = 'block'; }
    if (!dialog.querySelector('.subfolder-modal-close')) {
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'subfolder-modal-close';
      close.textContent = '×';
      close.setAttribute('aria-label', '팝업 닫기');
      close.setAttribute('data-close', '');
      dialog.prepend(close);
    }
    const label = '전체 이모지 선택';
    root.querySelectorAll('button').forEach(b => {
      const t = b.textContent;
      if (b.classList.contains('subfolder-emoji-toggle') || t.includes('전체 이모지 검색') || t.includes(label)) {
        if (t.trim() !== label) b.textContent = label;
        if (b.getAttribute('aria-label') !== label) b.setAttribute('aria-label', label);
      }
    });
  }
  function init() {
    const root = document.getElementById('modalRoot');
    if (root) new MutationObserver(tidyFolderModal).observe(root, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
