<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 스크랩 허브</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#293142;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1320px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.12em;color:#777e91;font-weight:700}.top h1{font-size:26px;margin:5px 0}.muted{color:#788092;font-size:13px}.btn{border:1px solid #dfe3ed;background:white;border-radius:10px;padding:10px 14px;color:#343b4d}.btn.primary{background:#465cc7;color:white;border-color:#465cc7}.btn.danger{color:#bb3548}.btn:hover{filter:brightness(.97)}.actions{display:flex;gap:8px;flex-wrap:wrap}.crumb{margin:25px 0 18px;display:flex;gap:8px;align-items:center;font-size:14px}.crumb button{background:none;border:0;color:#5267c4;padding:0}.crumb span{color:#8d94a5}.panel{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:22px;box-shadow:0 6px 24px #25315a08}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.platform{min-height:205px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}.platform strong{font-size:23px}.platform .glyph{font-size:32px}.platform:hover,.folder:hover{border-color:#9aa8ed;transform:translateY(-2px)}.platform,.folder{transition:.15s}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.folder{border:1px solid #e3e7f0;border-radius:15px;background:#fff;text-align:left;padding:18px;min-height:155px;position:relative}.folder .foldericon{font-size:32px}.folder strong{display:block;margin:10px 0 4px;overflow-wrap:anywhere}.folder small{color:#8b91a1}.folder .tooltip{display:none;position:absolute;z-index:3;bottom:calc(100% + 7px);left:0;width:230px;background:#2e364b;color:#fff;padding:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;box-shadow:0 8px 20px #0002}.folder:hover .tooltip,.folder:focus-visible .tooltip{display:block}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}.field label{font-size:12px;font-weight:700;color:#626a7c}.field input,.field textarea,.field select,.toolbar input,.toolbar select{border:1px solid #dfe3ed;border-radius:9px;padding:10px 11px;background:#fff;color:#293142;min-width:0;width:100%}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.toolbar input:focus{outline:2px solid #b9c3ff}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.section-head h2{margin:0;font-size:21px}.section-head h3{margin:5px 0 0;font-size:13px;font-weight:400;color:#818899}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1 1 200px}.toolbar select{width:auto;flex:0 1 160px}.note{border:1px solid #e3e7f0;border-left:4px solid #8291e7;background:#fff;border-radius:12px;padding:15px;margin:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.note h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}.note .summary{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:#555e70;margin:8px 0}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:#eef0fb;color:#5363b2;border-radius:50px;padding:4px 9px;font-size:11px}.note .meta{font-size:11px;color:#9299a7;margin-top:7px}.note-actions{display:flex;gap:6px;align-items:start;flex-wrap:wrap;justify-content:end}.note-actions button,.note-actions a{font-size:12px;text-decoration:none}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.thumb{width:53px;height:53px;object-fit:cover;border:1px solid #d9deeb;border-radius:8px;cursor:zoom-in}.note.compact .summary,.note.compact .thumbs{display:none}.note.titleonly .summary,.note.titleonly .thumbs,.note.titleonly .chips{display:none}.empty{padding:48px 12px;text-align:center;color:#8a91a2;border:1px dashed #d7dce8;border-radius:13px}.hint{font-size:12px;color:#8c91a0;line-height:1.6}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#1d2439b8;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.dialog{background:white;border-radius:17px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto}.dialog h2{font-size:19px;margin:0 0 18px}.modal-image{max-width:min(95vw,1200px);max-height:82vh;object-fit:contain;display:block}.image-dialog{position:relative;max-width:95vw}.image-close{position:absolute;top:-15px;right:-10px;border:0;border-radius:50%;background:white;font-size:22px;width:36px;height:36px}.small{font-size:12px}.pill{background:#edf0ff;color:#4d5eb8;padding:5px 9px;border-radius:30px}.footer{padding:30px 0;color:#9ba2b0;font-size:12px}.warning{background:#fff8e9;border:1px solid #f1dfae;padding:12px;border-radius:10px;font-size:12px;line-height:1.6;color:#795b22;margin:12px 0}@media(max-width:760px){.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.app{padding:18px 13px}.note{grid-template-columns:1fr}.note-actions{justify-content:start}.top h1{font-size:22px}}

/* Instagram 통합 검색 및 폴더 꾸미기 */
.search-view-toggle{min-width:144px;white-space:nowrap;display:inline-flex;justify-content:center;align-items:center;gap:6px;font-weight:700;border:1px solid #465cc7;color:#344bb3;background:#f1f3ff}.search-view-toggle:hover{background:#e6eaff}.search-result-head>div:first-child{flex:1;min-width:0}
.ig-searchbar{display:flex;align-items:center;gap:8px;margin:0 0 18px}.ig-searchbox{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:white;border:1px solid #dfe3ed;border-radius:12px;padding:0 12px}.ig-searchbox:focus-within{outline:2px solid #b9c3ff}.ig-searchbox svg{flex:none;color:#788092}.ig-searchbox input{border:0;outline:0;width:100%;min-width:0;padding:13px 0;background:transparent;color:#293142}.ig-searchbar .btn{font-size:20px;line-height:1;padding:11px 15px}.search-result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.search-layout{display:flex;gap:5px}.search-layout .selected{background:#465cc7;color:white;border-color:#465cc7}.search-results-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.search-results-grid .note{margin:0;grid-template-columns:1fr}.search-results-grid .note-actions{justify-content:start}.search-results-grid .note .summary{max-height:125px;overflow:auto}.folder-color-picker{display:flex;gap:10px;align-items:center}.folder-color-picker input[type=color]{width:54px;height:42px;padding:3px;flex:none}.folder-color-picker input[type=text]{flex:1}.folder-emoji-options{display:flex;flex-wrap:wrap;gap:5px}.folder-emoji-options button{font-size:23px;min-width:44px}.folder-emoji-options button.selected{background:#edf0ff;border-color:#465cc7}.folder-style-preview{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #dfe3ed;border-radius:12px;margin:0 0 14px}.folder-style-preview .foldericon{font-size:28px}@media(max-width:760px){.search-results-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-results-grid .note{min-width:0;padding:10px}.search-results-grid .note h3{overflow-wrap:anywhere}.search-results-grid .note-actions{flex-wrap:wrap}.search-view-actions{width:100%;justify-content:flex-end}}

/* 폴더 검색/표시 전환: 기존 상세·간략·제목 모드와 독립적으로 동작 */

</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">PERSONAL COLLECTION</div><h1>나의 스크랩 허브</h1><div class="muted">저장해 두고 다시 찾는 나만의 정보 서랍</div></div><div class="actions"><button class="btn" id="exportBtn">Backup_Export</button><button class="btn" id="importBtn">Backup_Upload</button><input class="hidden" id="importFile" type="file" accept=".json,application/json"></div></header><nav id="crumb" class="crumb"></nav><div id="view"></div><section id="syncPanel" class="panel" style="margin-top:20px"><strong>☁ 클라우드 동기화</strong><p class="hint" id="syncStatus">연결 준비 중…</p><div id="syncControls"></div></section><footer class="footer">로그아웃 상태에서는 현재 브라우저의 IndexedDB에 저장됩니다. 로그인 상태에서는 Supabase에 저장됩니다. 중요한 자료는 정기적으로 백업하세요.</footer></main><div id="modalRoot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./sync-config.js"></script><script src="./sync.js"></script><script>
'use strict';
let igSearchQuery='',igSearchActive=false,igAdvanced={folder:'',year:'',keyword:''},igSearchLayout='list';
const DB_NAME='personal-scrap-hub-v1', DB_VERSION=1;let db,route={platform:null,folder:null},folders=[],posts=[];const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString();const formatDate=s=>s?new Date(s).toLocaleDateString('ko-KR'):'';window.scrapFontPosts=()=>posts;window.scrapFontFolders=()=>folders;window.scrapFontRoute=()=>route;const platforms={instagram:{name:'Instagram',glyph:'◎'},twitter:{name:'Twitter (X)',glyph:'𝕏'}};
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'});if(!d.objectStoreNames.contains('posts'))d.createObjectStore('posts',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function transact(store,mode,action){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),req=action(t.objectStore(store));req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}const getAll=s=>window.scrapSync?.active?window.scrapSync.getAll(s):transact(s,'readonly',o=>o.getAll());const put=(s,x)=>window.scrapSync?.active?window.scrapSync.put(s,x):transact(s,'readwrite',o=>o.put(x));const del=(s,id)=>window.scrapSync?.active?window.scrapSync.del(s,id):transact(s,'readwrite',o=>o.delete(id));
async function refresh(){folders=await getAll('folders');posts=await getAll('posts');render()}
function go(platform=null,folder=null){if(platform!=='instagram'||folder){igSearchActive=false;igSearchQuery='';igAdvanced={folder:'',year:'',keyword:''}}route={platform,folder};render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){queueMicrotask(()=>window.scrapFontApply?.());const v=$('view'),c=$('crumb');c.innerHTML=`<button data-nav="home">홈</button>${route.platform?`<span>›</span><button data-nav="platform">${escapeHtml(platforms[route.platform].name)}</button>`:''}${route.folder?`<span>›</span><strong>${escapeHtml(folders.find(x=>x.id===route.folder)?.name||'폴더')}</strong>`:''}`;if(!route.platform){v.innerHTML=`<div class="section-head"><div><h2>플랫폼 선택</h2><h3>저장한 링크를 플랫폼별로 정리하세요.</h3></div></div><div class="grid">${Object.entries(platforms).map(([key,p])=>`<button class="panel platform" data-platform="${key}"><span class="glyph">${p.glyph}</span><div><strong>${p.name}</strong><div class="muted">폴더 ${folders.filter(f=>f.platform===key).length}개 · 스크랩 ${posts.filter(x=>x.platform===key).length}개</div></div><span class="muted">컬렉션 열기 →</span></button>`).join('')}</div>`;return}if(!route.folder){const fs=folders.filter(x=>x.platform===route.platform).sort((a,b)=>a.name.localeCompare(b.name,'ko'));v.innerHTML=`${route.platform==='instagram'?instagramSearchBar():''}<div class="section-head"><div><h2>${escapeHtml(platforms[route.platform].name)} 폴더</h2><h3>폴더에 마우스를 올리거나 키보드로 선택하면 설명을 볼 수 있습니다.</h3></div></div><div class="split"><div>${fs.length?`<div class="folders">${fs.map(f=>`<button class="folder" data-folder="${escapeHtml(f.id)}" style="border-color:${safeFolderColor(f.color)}"><span class="foldericon">${escapeHtml(f.icon||'📁')}</span><strong>${escapeHtml(f.name)}</strong><small>스크랩 ${posts.filter(p=>p.folderId===f.id).length}개</small><span class="tooltip">${escapeHtml(f.description||'설명 없음')}</span></button>`).join('')}</div>`:'<div class="empty">아직 폴더가 없습니다. 오른쪽에서 만들어 보세요.</div>'}</div><aside class="panel"><h3>＋ 새 폴더</h3><form id="folderForm"><div class="field"><label for="folderName">폴더명 / 정보 종류</label><input id="folderName" maxlength="70" required placeholder="예: 디자인 레퍼런스"></div>${folderStyleFields()}<div class="field"><label for="folderDesc">설정 정보 메모</label><textarea id="folderDesc" placeholder="이 폴더에 저장할 자료의 기준"></textarea></div><button class="btn primary" type="submit">폴더 생성</button></form><p class="hint">저장 수량은 스크랩 추가·삭제 시 자동 계산됩니다.</p></aside></div>${route.platform==='instagram'?'</div>':''}`;if(route.platform==='instagram'){initFolderStyleControls(v);if(igSearchActive)renderInstagramResults()}return}renderFolder()}

const FOLDER_EMOJIS=['📁','📂','⭐','❤️','🎨','📷','🎬','🎵','📚','💡','📝','🌸','🌿','🌙','✨','🧩','🛍️','🍀','🎮','🏷️','🖼️','🧵','🪄','🔖'];
function safeFolderColor(c){return /^#[0-9a-fA-F]{6}$/.test(String(c||''))?c:'#e3e7f0'}
function folderStyleFields(f={}){const color=safeFolderColor(f.color||'#e3e7f0'),icon=f.icon||'📁';return `<div class="field"><label>폴더 테두리 색상 (색상표 또는 HEX 코드)</label><div class="folder-color-picker"><input type="color" data-color-picker value="${color}" aria-label="테두리 색상 선택"><input type="text" name="color" data-color-text maxlength="7" value="${color}" placeholder="#000000" aria-label="HEX 색상 코드"></div></div><div class="field"><label>폴더 아이콘 (이모지 선택)</label><div class="folder-emoji-options">${FOLDER_EMOJIS.map(e=>`<button type="button" class="btn ${e===icon?'selected':''}" data-emoji="${e}" aria-label="${e} 선택">${e}</button>`).join('')}</div><input type="hidden" name="icon" value="${escapeHtml(icon)}"></div><div class="folder-style-preview" data-style-preview style="border-color:${color}"><span class="foldericon" data-preview-icon>${escapeHtml(icon)}</span><span>폴더 디자인 미리보기</span></div>`}
function initFolderStyleControls(root){if(!root)return;const picker=root.querySelector('[data-color-picker]'),txt=root.querySelector('[data-color-text]'),preview=root.querySelector('[data-style-preview]'),icon=root.querySelector('[name=icon]');if(!picker||!txt)return;picker.oninput=()=>{txt.value=picker.value;preview.style.borderColor=picker.value};txt.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(txt.value)){picker.value=txt.value;preview.style.borderColor=txt.value}};root.querySelectorAll('[data-emoji]').forEach(btn=>btn.onclick=()=>{icon.value=btn.dataset.emoji;root.querySelector('[data-preview-icon]').textContent=btn.dataset.emoji;root.querySelectorAll('[data-emoji]').forEach(x=>x.classList.toggle('selected',x===btn))})}
function readFolderStyle(form){const color=String(form.querySelector('[name=color]')?.value||'#e3e7f0').trim();if(!/^#[0-9a-fA-F]{6}$/.test(color)){alert('색상 코드는 #000000 형식으로 입력해 주세요.');return null}return {color,icon:String(form.querySelector('[name=icon]')?.value||'📁')}}
function instagramSearchBar(){return `<div class="ig-searchbar"><label class="ig-searchbox"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="igGlobalSearch" type="search" autocomplete="off" placeholder="모든 폴더에서 제목·키워드·@계정 검색" value="${escapeHtml(igSearchQuery)}" aria-label="인스타그램 전체 스크랩 검색"></label><button class="btn" id="igAdvancedBtn" type="button" aria-label="상세 검색 열기" title="상세 검색">＋</button></div><div id="igGlobalResults" class="hidden"></div><div id="igFolderContents">`}
function filterInstagramPosts(){const q=igSearchQuery.trim().toLocaleLowerCase(),isAccount=q.startsWith('@'),account=q.slice(1).trim();return posts.filter(p=>{if(p.platform!=='instagram')return false;if(q){if(isAccount){if(!account||!String(p.authorHandle||'').replace(/^@/,'').toLocaleLowerCase().includes(account))return false}else if(![p.title,...(p.keywords||[])].join(' ').toLocaleLowerCase().includes(q))return false}if(igAdvanced.folder&&p.folderId!==igAdvanced.folder)return false;if(igAdvanced.year&&String(p.createdAt||'').slice(0,4)!==igAdvanced.year)return false;if(igAdvanced.keyword&&!((p.keywords||[]).join(' ').toLocaleLowerCase().includes(igAdvanced.keyword.toLocaleLowerCase())))return false;return true}).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')))}
function instagramPostCard(p){const folder=folders.find(f=>f.id===p.folderId);const profile=authorProfileUrl(p.platform,p.authorHandle);return `<article class="note" data-font-post="${escapeHtml(p.id)}"><div><div class="muted" style="margin-bottom:6px">${escapeHtml(folder?.icon||'📁')} ${escapeHtml(folder?.name||'삭제된 폴더')}</div><h3>${escapeHtml(p.title||'제목 없음')}</h3><div class="chips">${(p.keywords||[]).map(k=>`<span class="chip">#${escapeHtml(k)}</span>`).join('')}</div><p class="summary">${escapeHtml(p.summary||'')}</p><div class="thumbs">${(p.images||[]).map((img,i)=>`<img class="thumb" data-image="${escapeHtml(p.id)}" data-index="${i}" src="${img}" alt="첨부 이미지 ${i+1}">`).join('')}</div><div class="meta">추가일 ${formatDate(p.createdAt)}</div></div><div class="note-actions"><a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>${profile?`<a class="btn" href="${escapeHtml(profile)}" target="_blank" rel="noopener noreferrer">@${escapeHtml(p.authorHandle.replace(/^@/,''))} ↗</a>`:''}${p.authorName&&profile?`<a class="btn" href="${escapeHtml(profile)}" target="_blank" rel="noopener noreferrer">${escapeHtml(p.authorName)} ↗</a>`:''}<button class="btn" data-search-edit="${escapeHtml(p.id)}">수정</button><button class="btn danger delete-action" data-delpost="${escapeHtml(p.id)}">삭제</button></div></article>`}
function renderInstagramResults(){queueMicrotask(()=>window.scrapFontApply?.());const results=$('igGlobalResults'),contents=$('igFolderContents');if(!results||!contents)return;results.classList.toggle('hidden',!igSearchActive);contents.classList.toggle('hidden',igSearchActive);if(!igSearchActive)return;const list=filterInstagramPosts(),filters=[igSearchQuery.trim()&&`검색어: ${igSearchQuery.trim()}`,igAdvanced.folder&&`폴더: ${folders.find(f=>f.id===igAdvanced.folder)?.name||''}`,igAdvanced.year&&`추가 연도: ${igAdvanced.year}`,igAdvanced.keyword&&`키워드: ${igAdvanced.keyword}`].filter(Boolean).join(' · ');results.innerHTML=`<div class="search-result-head"><div><strong>전체 검색 결과 ${list.length}개</strong><div class="hint">${escapeHtml(filters||'인스타그램 전체 스크랩')}</div></div><div class="actions search-view-actions"><button type="button" class="btn search-view-toggle" id="igLayoutToggle" data-ig-layout-toggle="true" aria-label="검색 결과 보기 방식 전환, 현재 ${igSearchLayout==='list'?'리스트뷰':'그리드뷰'}" title="클릭하여 ${igSearchLayout==='list'?'그리드뷰':'리스트뷰'}로 전환">${igSearchLayout==='list'?'▦ 그리드뷰로 전환':'☰ 리스트뷰로 전환'}</button><button type="button" class="btn" id="igSearchClear">검색 닫기</button></div></div><div class="${igSearchLayout==='grid'?'search-results-grid':''}">${list.length?list.map(instagramPostCard).join(''):'<div class="empty">조건에 맞는 스크랩이 없습니다.</div>'}</div>`}
function instagramAdvancedModal(){const fs=folders.filter(f=>f.platform==='instagram'),years=[...new Set(posts.filter(p=>p.platform==='instagram').map(p=>String(p.createdAt||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();modal(`<h2>인스타그램 상세 검색</h2><form id="igAdvancedForm"><div class="field"><label>폴더</label><select name="folder"><option value="">전체 폴더</option>${fs.map(f=>`<option value="${escapeHtml(f.id)}" ${igAdvanced.folder===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}</select></div><div class="field"><label>추가 연도</label><select name="year"><option value="">전체 연도</option>${years.map(y=>`<option value="${y}" ${igAdvanced.year===y?'selected':''}>${y}년</option>`).join('')}</select></div><div class="field"><label>키워드 (직접 입력)</label><input name="keyword" maxlength="100" value="${escapeHtml(igAdvanced.keyword)}" placeholder="예: 디자인"></div><div class="actions"><button class="btn primary" type="submit">검색 적용</button><button class="btn" type="button" id="igResetAdvanced">조건 초기화</button><button class="btn" type="button" data-close>취소</button></div></form>`);$('igAdvancedForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);igAdvanced={folder:String(fd.get('folder')),year:String(fd.get('year')),keyword:String(fd.get('keyword')).trim()};igSearchActive=true;closeModal();renderInstagramResults()};$('igResetAdvanced').onclick=()=>{igAdvanced={folder:'',year:'',keyword:''};igSearchActive=Boolean(igSearchQuery.trim());closeModal();renderInstagramResults()}}

function renderFolder(){const f=folders.find(x=>x.id===route.folder);if(!f){route.folder=null;render();return}const v=$('view');v.innerHTML=`<div class="section-head"><div><h2>${escapeHtml(f.name)}</h2><h3>키워드: ${escapeHtml(f.description||'설명 없음')}</h3></div><div class="actions"><button class="btn" id="editFolder">폴더 수정</button><button class="btn danger" id="deleteFolder">폴더 삭제</button><button class="btn primary" id="addPost">＋ 스크랩 추가</button></div></div><div class="toolbar folder-toolbar"><input id="search" type="search" placeholder="제목·키워드·내용 검색"><select id="sort" aria-label="정렬"><option value="new">추가일 최신순</option><option value="old">추가일 오래된순</option><option value="priority">중요도 높은순</option><option value="name">가나다순</option></select><select id="display" aria-label="표시 방식"><option value="detail">상세형</option><option value="compact">간략형</option><option value="titleonly">제목형</option></select><div class="folder-view-controls"><span class="pill" id="postCount"></span><button type="button" class="btn folder-layout-toggle" id="folderLayoutToggle" aria-label="폴더 스크랩 레이아웃 전환" title="리스트뷰와 그리드뷰 전환">▦ 그리드뷰로 전환</button></div></div><div id="postList"></div>`;updatePostList()}

function folderAuthorButtons(p,mode){
  const name=String(p.authorName??'').trim();
  const handle=String(p.authorHandle??'').trim().replace(/^@/,'');
  const profile=authorProfileUrl(p.platform,handle);
  const attrs=profile?`href="${escapeHtml(profile)}" target="_blank" rel="noopener noreferrer"`:'href="#" aria-disabled="true" onclick="return false"';
  const nameButton=name?`<a class="btn author-name-action" ${attrs}>${escapeHtml(name)} ↗</a>`:'';
  const handleButton=handle?`<a class="btn author-handle-action" ${attrs}>@${escapeHtml(handle)} ↗</a>`:'';
  if(mode==='detail')return handleButton+nameButton;
  return nameButton||handleButton;
}

function updatePostList(){queueMicrotask(()=>window.scrapFontApply?.());if(!route.folder||!$('postList'))return;const q=$('search').value.trim().toLocaleLowerCase(),sort=$('sort').value,mode=$('display').value;let list=posts.filter(p=>p.folderId===route.folder&&[p.title,p.summary,(p.keywords||[]).join(' ')].join(' ').toLocaleLowerCase().includes(q));list.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title,'ko'):sort==='priority'?(b.priority||0)-(a.priority||0)||b.createdAt.localeCompare(a.createdAt):sort==='old'?a.createdAt.localeCompare(b.createdAt):b.createdAt.localeCompare(a.createdAt));$('postCount').textContent=`${list.length}개`; $('postList').classList.toggle('folder-post-grid',folderLayout==='grid');const toggle=$('folderLayoutToggle');if(toggle){toggle.textContent=folderLayout==='list'?'▦ 그리드뷰로 전환':'☰ 리스트뷰로 전환';toggle.setAttribute('aria-label',folderLayout==='list'?'그리드뷰로 전환':'리스트뷰로 전환');toggle.setAttribute('aria-pressed',String(folderLayout==='grid'));} $('postList').innerHTML=list.length?list.map(p=>`<article class="note ${mode}" data-font-post="${escapeHtml(p.id)}"><div class="note-main">${mode!=='detail'&&(p.images||[]).length?`<div class="note-cover"><img tabindex="0" role="button" data-image="${escapeHtml(p.id)}" data-index="0" src="${p.images[0]}" alt="${escapeHtml(p.title)} 대표 이미지 확대">${p.images.length>1?`<span class="cover-count">+${p.images.length-1}</span>`:''}</div>`:''}<div class="note-text"><h3>${escapeHtml(p.title)}</h3><div class="chips">${(p.keywords||[]).map(k=>`<span class="chip">#${escapeHtml(k)}</span>`).join('')}${p.priority?`<span class="chip">중요도 ${p.priority}</span>`:''}</div><p class="summary">${escapeHtml(p.summary)}</p><div class="thumbs">${(p.images||[]).map((img,i)=>`<img class="thumb" tabindex="0" role="button" data-image="${escapeHtml(p.id)}" data-index="${i}" src="${img}" alt="첨부 이미지 ${i+1}">`).join('')}</div><div class="meta">추가일 ${formatDate(p.createdAt)} · 이미지 ${(p.images||[]).length}장</div></div></div><div class="note-actions"><a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">원문 ↗</a>${folderAuthorButtons(p,mode)}${mode==='detail'?`<button class="btn edit-action" data-editpost="${escapeHtml(p.id)}">수정</button><button class="btn danger delete-action" data-delpost="${escapeHtml(p.id)}">삭제</button>`:''}</div></article>`).join(''):'<div class="empty">검색 결과가 없거나 아직 등록된 스크랩이 없습니다.</div>'}
function closeModal(){$('modalRoot').innerHTML=''}function modal(content){$('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true">${content}</div></div>`}
function folderModal(f){modal(`<h2>폴더 수정</h2><form id="folderEditForm"><div class="field"><label>폴더명</label><input name="name" required maxlength="70" value="${escapeHtml(f.name)}"></div><div class="field"><label>설명</label><textarea name="description">${escapeHtml(f.description)}</textarea></div>${folderStyleFields(f)}<div class="actions"><button class="btn primary" type="submit">저장</button><button class="btn" type="button" data-close>취소</button></div></form>`);$('folderEditForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const style=readFolderStyle(e.target);if(!style)return;await put('folders',{...f,name:String(fd.get('name')).trim(),description:String(fd.get('description')).trim(),...style});closeModal();await refresh()};initFolderStyleControls($('folderEditForm'))}
function keywordSuggestion(text){const words=String(text).replace(/https?:\/\/\S+/g,' ').match(/[가-힣A-Za-z0-9]{2,}/g)||[];const stop=new Set(['그리고','하지만','있는','대한','관련','정보','내용','정리','위한','this','that','with','from']);const count={};for(const w of words){const k=w.toLowerCase();if(!stop.has(k))count[k]=(count[k]||0)+1}return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}
function validUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)}catch{return false}}
function authorAccounts(){const map=new Map();for(const p of posts){const handle=String(p.authorHandle||'').trim().replace(/^@/,'');const name=String(p.authorName||'').trim();if(!handle&&!name)continue;const key=p.platform+'|'+handle.toLowerCase()+'|'+name.toLowerCase();const f=folders.find(x=>x.id===p.folderId);if(!map.has(key))map.set(key,{name,handle,platform:p.platform,folderName:f?.name||'삭제된 폴더'});}return [...map.values()].filter(a=>a.platform===route.platform).sort((a,b)=>a.name.localeCompare(b.name,'ko'));}
function authorProfileUrl(platform,handle){const h=String(handle||'').trim().replace(/^@/,'');if(!h)return '';if(platform==='instagram'&&/^[a-zA-Z0-9._]{1,30}$/.test(h))return 'https://www.instagram.com/'+encodeURIComponent(h)+'/';if(platform==='twitter'&&/^[a-zA-Z0-9_]{1,15}$/.test(h))return 'https://x.com/'+encodeURIComponent(h);return '';}
function addAuthorKeywords(words,name,handle){const list=[...words];for(const w of [name,handle.replace(/^@/,'')]){const k=String(w||'').trim();if(k&&!list.some(x=>x.toLowerCase()===k.toLowerCase()))list.push(k)}return list.slice(0,12)}
function postModal(p=null){const edit=!!p;modal(`<h2>${edit?'스크랩 수정':'새 스크랩 추가'}</h2><form id="postForm"><div class="field"><label>이름 / 제목 *</label><input name="title" maxlength="180" required value="${escapeHtml(p?.title||'')}" placeholder="게시물 핵심 내용"></div><div class="field"><label>원문 링크 *</label><input name="url" type="url" required value="${escapeHtml(p?.url||'')}" placeholder="https://..."></div><div class="field"><label>작성자 이름 (수동 입력)</label><input name="authorName" maxlength="100" value="${escapeHtml(p?.authorName||'')}" placeholder="예: 디자인 아카이브"></div><div class="field"><label>작성자 계정명 (수동 입력)</label><div class="actions" style="flex-wrap:nowrap"><input name="authorHandle" maxlength="100" value="${escapeHtml(p?.authorHandle||'')}" placeholder="예: @design.archive" style="min-width:0;flex:1"><button class="btn" type="button" id="chooseAuthor" style="flex:none">추가</button></div><div class="hint">추가 버튼: 이전에 스크랩으로 저장한 계정 선택</div><div id="authorChoices" class="hidden" style="margin-top:8px"></div></div><div class="field"><label>정보 개요 (원문을 직접 요약하거나 붙여넣기)</label><textarea name="summary" id="postSummary" placeholder="저장할 핵심 내용">${escapeHtml(p?.summary||'')}</textarea></div><div class="field"><label>키워드 2~3개 (쉼표로 구분)</label><input name="keywords" id="keywords" value="${escapeHtml((p?.keywords||[]).join(', '))}" placeholder="디자인, 참고자료"><button class="btn small" type="button" id="suggestKeywords">입력한 글에서 키워드 추천</button></div><div class="field"><label>중요도</label><select name="priority">${[0,1,2,3].map(n=>`<option value="${n}" ${n===(p?.priority||0)?'selected':''}>${n===0?'일반':n+'단계'}</option>`).join('')}</select></div><div class="field"><label>이미지 첨부 (여러 장 가능)</label><input name="images" type="file" accept="image/*" multiple><div class="hint">브라우저 저장 공간을 고려하여 이미지는 장당 최대 3MB, 전체 15MB 이하로 제한합니다.</div>${edit?`<div class="hint">현재 이미지 ${(p.images||[]).length}장 · 새 이미지 선택 시 기존 이미지에 추가됩니다.</div><label><input type="checkbox" name="clearImages"> 기존 이미지 모두 제거</label>`:''}</div><div class="warning">SNS 원문·이미지 자동 추출은 공식 API 권한에 따라 제한됩니다. 이 버전은 링크와 요약을 직접 입력하는 방식입니다.</div><div class="actions"><button class="btn primary" type="submit">${edit?'변경 저장':'스크랩 저장'}</button><button class="btn" type="button" data-close>취소</button></div></form>`);$('chooseAuthor').onclick=()=>{const box=$('authorChoices');if(!box.classList.contains('hidden')){box.classList.add('hidden');return;}const list=authorAccounts();box.innerHTML=list.length?list.map((a,i)=>`<button type="button" class="btn" data-author-index="${i}" style="display:block;width:100%;text-align:left;margin-bottom:6px">${escapeHtml(a.name||'(이름 없음)')} / ${escapeHtml(a.handle?'@'+a.handle:'(계정명 없음)')} / ${escapeHtml(a.folderName)}</button>`).join(''):'<div class="hint">저장된 계정이 없습니다. 작성자 정보를 입력한 스크랩을 먼저 저장하세요.</div>';box.classList.remove('hidden');box.querySelectorAll('[data-author-index]').forEach(b=>b.onclick=()=>{const a=list[Number(b.dataset.authorIndex)];$('postForm').elements.authorName.value=a.name;$('postForm').elements.authorHandle.value=a.handle?'@'+a.handle:'';box.classList.add('hidden')});};$('suggestKeywords').onclick=()=>{$('keywords').value=keywordSuggestion($('postSummary').value).join(', ')};$('postForm').onsubmit=async e=>{e.preventDefault();const form=e.target,fd=new FormData(form),title=String(fd.get('title')).trim(),url=String(fd.get('url')).trim();if(!title||!validUrl(url)){alert('제목과 올바른 http(s) 링크를 입력하세요.');return}const files=[...form.querySelector('[name=images]').files],total=files.reduce((n,f)=>n+f.size,0);if(files.some(f=>f.size>3*1024*1024)||total>15*1024*1024){alert('이미지는 장당 3MB, 신규 첨부 총 15MB 이하여야 합니다.');return}const imgs=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})));const base=edit&&!fd.get('clearImages')?(p.images||[]):[];const record={id:p?.id||uid(),platform:route.platform,folderId:p?.folderId||route.folder,title,url,summary:String(fd.get('summary')).trim(),authorName:String(fd.get('authorName')).trim(),authorHandle:String(fd.get('authorHandle')).trim().replace(/^@/,''),keywords:addAuthorKeywords(String(fd.get('keywords')).split(',').map(s=>s.trim()).filter(Boolean),String(fd.get('authorName')).trim(),String(fd.get('authorHandle')).trim()),priority:Number(fd.get('priority'))||0,images:[...base,...imgs],createdAt:p?.createdAt||today(),updatedAt:today()};try{await put('posts',record);closeModal();await refresh()}catch(err){alert('저장에 실패했습니다. 브라우저 저장 공간을 확인하세요. '+err.message)}}}
function showImage(id,index){const p=posts.find(x=>x.id===id),src=p?.images?.[index];if(!src)return;$('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="image-dialog" role="dialog" aria-modal="true"><button class="image-close" data-close aria-label="닫기">×</button><img class="modal-image" src="${src}" alt="확대 이미지"></div></div>`}
async function exportBackup(){
  const button=$('exportBtn');
  if(button.disabled)return;
  const label=button.textContent;
  button.disabled=true;button.textContent='백업 준비 중…';
  try{
    const [savedFolders,savedPosts]=await Promise.all([getAll('folders'),getAll('posts')]);
    const payload={version:1,exportedAt:today(),folders:savedFolders,posts:savedPosts};
    const filename='스크랩허브_백업_'+new Date().toISOString().slice(0,10)+'.json';
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // iOS Safari에서 다운로드가 시작되기 전에 Blob URL이 해제되지 않도록 충분히 유지합니다.
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    alert('백업 파일 저장을 요청했습니다. Safari의 다운로드 항목 또는 파일 앱의 다운로드 폴더를 확인해 주세요.\n폴더 '+savedFolders.length+'개 · 스크랩 '+savedPosts.length+'개');
  }catch(err){
    console.error('Backup export failed',err);
    alert('백업을 생성하지 못했습니다: '+(err?.message||String(err))+'\n인터넷 연결과 로그인 상태를 확인해 주세요.');
  }finally{button.disabled=false;button.textContent=label;}
}
async function importBackup(file){if(!file)return;try{if(file.size>80*1024*1024)throw Error('파일이 80MB를 초과합니다.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.folders)||!Array.isArray(data.posts))throw Error('지원하지 않는 백업 형식입니다.');if(!confirm(`폴더 ${data.folders.length}개와 스크랩 ${data.posts.length}개를 가져오시겠습니까? 같은 ID는 덮어씁니다.`))return;for(const f of data.folders){if(typeof f.id==='string'&&platforms[f.platform]&&typeof f.name==='string')await put('folders',f)}for(const p of data.posts){if(typeof p.id==='string'&&platforms[p.platform]&&validUrl(p.url)&&typeof p.folderId==='string'&&Array.isArray(p.images))await put('posts',p)}await refresh();alert('가져오기가 완료되었습니다.')}catch(err){alert('가져오기 실패: '+err.message)}finally{$('importFile').value=''}}
document.addEventListener('click',async e=>{const t=e.target.closest('button,a,img');if(!t)return;if(t.id==='folderLayoutToggle'){folderLayout=folderLayout==='list'?'grid':'list';updatePostList()}else if(t.id==='igAdvancedBtn')instagramAdvancedModal();else if(t.id==='igSearchClear'){igSearchQuery='';igAdvanced={folder:'',year:'',keyword:''};igSearchActive=false;render()}else if(t.dataset.igLayoutToggle){igSearchLayout=igSearchLayout==='list'?'grid':'list';renderInstagramResults()}else if(t.dataset.searchEdit){const p=posts.find(x=>x.id===t.dataset.searchEdit);if(p){route.folder=p.folderId;postModal(p);route.folder=null}}else if(t.dataset.nav==='home')go();else if(t.dataset.nav==='platform')go(route.platform);else if(t.dataset.platform)go(t.dataset.platform);else if(t.dataset.folder)go(route.platform,t.dataset.folder);else if(t.id==='addPost')postModal();else if(t.id==='editFolder')folderModal(folders.find(f=>f.id===route.folder));else if(t.id==='deleteFolder'){const f=folders.find(f=>f.id===route.folder),related=posts.filter(p=>p.folderId===f.id);if(confirm(`'${f.name}' 폴더와 스크랩 ${related.length}개를 모두 삭제하시겠습니까?`)){for(const p of related)await del('posts',p.id);await del('folders',f.id);route.folder=null;await refresh()}}else if(t.dataset.editpost)postModal(posts.find(p=>p.id===t.dataset.editpost));else if(t.dataset.delpost){if(confirm('이 스크랩을 삭제하시겠습니까?')){await del('posts',t.dataset.delpost);await refresh()}}else if(t.dataset.image)showImage(t.dataset.image,Number(t.dataset.index));else if(t.hasAttribute('data-close'))closeModal();else if(t.id==='overlay'&&e.target===t)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('img[data-image]')){e.preventDefault();showImage(e.target.dataset.image,Number(e.target.dataset.index))}});document.addEventListener('input',e=>{if(e.target.id==='search')updatePostList();else if(e.target.id==='igGlobalSearch'){igSearchQuery=e.target.value;igSearchActive=Boolean(igSearchQuery.trim()||igAdvanced.folder||igAdvanced.year||igAdvanced.keyword);renderInstagramResults()}});document.addEventListener('change',e=>{if(['sort','display'].includes(e.target.id))updatePostList()});document.addEventListener('submit',async e=>{if(e.target.id!=='folderForm')return;e.preventDefault();const name=$('folderName').value.trim(),description=$('folderDesc').value.trim();if(!name)return;const style=readFolderStyle(e.target);if(!style)return;await put('folders',{id:uid(),platform:route.platform,name,description,...style,createdAt:today()});await refresh()});$('exportBtn').onclick=exportBackup;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>importBackup(e.target.files[0]);openDB().then(d=>{db=d;window.scrapRefresh=refresh;refresh()}).catch(err=>{$('view').innerHTML=`<div class="warning">브라우저 저장소를 열지 못했습니다. 일반 브라우저에서 열거나 로컬 서버를 이용하세요. ${escapeHtml(err.message)}</div>`});
